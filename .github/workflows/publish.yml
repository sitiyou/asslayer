name: Build and publish

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - name: Check release version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          if os.environ['RELEASE_TAG'] != f'v{version}':
              raise SystemExit(f'Release tag must be v{version}')
          PY
      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ pkg-config ninja-build libwayland-dev libvulkan-dev glslc libass-dev libfontconfig1-dev
      - name: Install Python build tools
        run: python -m pip install build twine
      - name: Build source distribution
        run: python -m build --sdist
      - name: Check distribution metadata
        run: python -m twine check --strict dist/*
      - name: Build wheel from source distribution
        run: python -m pip wheel --no-deps dist/*.tar.gz --wheel-dir wheelhouse
      - name: Check installed import and type stub
        run: |
          python -m pip install --no-deps wheelhouse/*.whl
          cd "$RUNNER_TEMP"
          python - <<'PY'
          from pathlib import Path
          import asslayer

          assert hasattr(asslayer, 'ApplicationController')
          assert Path(asslayer.__file__).with_name('asslayer.pyi').is_file()
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: distributions
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/asslayer/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: distributions
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
