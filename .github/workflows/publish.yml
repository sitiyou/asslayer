name: Build and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - name: Check publishing branch
        if: github.event_name == 'workflow_dispatch'
        run: test "$GITHUB_REF" = refs/heads/main
      - name: Read package version
        id: version
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'version={version}', file=output)
          PY
      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ pkg-config ninja-build libwayland-dev libvulkan-dev glslc libass-dev libfontconfig1-dev
      - name: Install Python build tools
        run: python -m pip install build twine
      - name: Build source distribution
        run: python -m build --sdist
      - name: Check distribution metadata
        run: python -m twine check --strict dist/*
      - name: Build wheel from source distribution
        run: python -m pip wheel --no-deps dist/*.tar.gz --wheel-dir wheelhouse
      - name: Check installed import and type stub
        run: |
          python -m pip install --no-deps wheelhouse/*.whl
          cd "$RUNNER_TEMP"
          python - <<'PY'
          from pathlib import Path
          import asslayer

          assert hasattr(asslayer, 'ApplicationController')
          assert Path(asslayer.__file__).with_name('asslayer.pyi').is_file()
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: distributions
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.build.outputs.version }}
        run: |
          gh api --method POST "repos/$GH_REPO/git/refs" \
            -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA"
          gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes

  publish:
    if: github.event_name == 'workflow_dispatch'
    needs: [build, release]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/asslayer/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: distributions
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
