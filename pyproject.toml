[build-system]
requires = ["meson-python>=0.15", "pybind11>=2.12"]
build-backend = "mesonpy"

[project]
name = "asslayer"
version = "0.1.0"
description = "ASS subtitle desktop overlay for Wayland, rendered with libass and Vulkan"
readme = "README.md"
requires-python = ">=3.14"
license = {text = "GPL-3.0-only"}

[project.urls]
Repository = "https://github.com/sitiyou/asslayer"
Issues = "https://github.com/sitiyou/asslayer/issues"

[dependency-groups]
dev = [
    "meson-python>=0.15",
    "pybind11>=2.12",
    "meson>=1.3.0",
]

[tool.uv]
no-build-isolation-package = ["asslayer"]

[tool.meson-python.args]
setup = ["-Dbuildtype=release"]
